<style>
:root{--ink:#172d3c;--muted:#506474;--brand:#145e75;--brand-dark:#123b4c;--bg:#f3f6f8;--white:#fff;--line:#d4dfe5;--ok:#166534;--warn:#854d0e;--bad:#991b1b;--radius:12px;--shadow:0 2px 8px #1730470b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}button,input,select{font:inherit}button,a,input,select,textarea{outline-offset:3px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #16749a}button{cursor:pointer;min-height:42px}button:disabled{cursor:not-allowed;opacity:.65}a{color:var(--brand)}.skip{position:absolute;top:-100px;left:12px;background:white;padding:10px;z-index:20}.skip:focus{top:12px}.layout{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}.sidebar{background:var(--brand-dark);color:white;padding:22px 14px}.logo{display:flex;gap:12px;align-items:center;padding:3px 8px 22px}.logo-mark{display:grid;place-items:center;background:#4bc1d2;color:#123b4c;font-weight:800;border-radius:10px;width:42px;height:42px}.logo strong{font-size:18px;line-height:1.1}.logo small{display:block;color:#cde6ec;font-size:12px}.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:#cde6ec;margin:16px 8px 6px}.nav button{display:block;width:100%;text-align:left;padding:10px 12px;border:0;border-radius:8px;background:transparent;color:#fff;margin:3px 0}.nav button[aria-current=page]{background:#fff;color:var(--brand-dark);font-weight:700}.nav button:hover:not([aria-current=page]){background:#1f5368}.content{min-width:0}.topbar{display:flex;gap:14px;align-items:center;justify-content:space-between;background:var(--white);border-bottom:1px solid var(--line);padding:14px 26px;flex-wrap:wrap}.topbar strong{font-size:15px}.profile{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.profile label{font-size:12px;color:var(--muted)}.profile select{max-width:200px}.mobile-toggle{display:none}.banner{margin:20px 26px 0;border:1px solid #a8ced9;background:#e7f5f7;border-radius:9px;padding:10px 14px;color:#16475d;font-size:13px}.main{padding:24px 26px 40px;max-width:1500px;margin:auto}.crumb{color:var(--muted);font-size:13px}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:8px 0 20px}.page-head h1{font-size:30px;letter-spacing:-.035em;line-height:1.15;margin:0}.page-head p{margin:8px 0 0;color:var(--muted)}.buttons{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:8px;padding:9px 14px;background:var(--white);color:var(--ink);font-weight:650}.primary{background:var(--brand);border-color:var(--brand);color:white}.danger{background:#991b1b;border-color:#991b1b;color:#fff}.panel,.metric{background:white;border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);min-width:0}.panel h2{font-size:17px;margin:0 0 12px}.panel h3{font-size:15px;margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.metric span{display:block;color:var(--muted);font-size:13px}.metric strong{display:block;font-size:30px;letter-spacing:-.04em;margin:3px 0}.metric small{font-size:12px;color:var(--muted)}.pill{display:inline-block;border-radius:99px;padding:3px 9px;font-size:12px;font-weight:650;white-space:nowrap;background:#e7eef2;color:#304c5e}.pill.ok{background:#dcfce7;color:var(--ok)}.pill.warn{background:#fef3c7;color:var(--warn)}.pill.bad{background:#fee2e2;color:var(--bad)}.table-wrap{overflow:auto;max-width:100%;border:1px solid var(--line);border-radius:8px}table{border-collapse:collapse;width:100%;min-width:540px;font-size:14px}th,td{text-align:left;vertical-align:middle;padding:12px 13px;border-bottom:1px solid var(--line)}th{background:#f5f8fa;color:#344e5f;font-weight:700;white-space:nowrap}tr:last-child td{border-bottom:0}td button{min-height:36px;padding:5px 10px}.toolbar{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin:0 0 14px}.toolbar>label{flex:1;min-width:145px}.field{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:13px}input,select,textarea{width:100%;padding:9px 11px;border:1px solid #a5b5c1;border-radius:8px;background:white;color:var(--ink);min-height:42px}input[readonly]{background:#f2f5f7}.field small,.muted{color:var(--muted);font-weight:400}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.check-list{padding:0;list-style:none;margin:0}.check-list li{padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center}.check-list li:last-child{border:0}.callout{border-left:4px solid #b45309;background:#fffbeb;padding:12px;margin-top:14px;color:#78350f;border-radius:4px}.steps{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}.steps span{padding:8px 12px;border-radius:6px;background:#e6eef2;font-size:13px}.steps .active{background:#d1e9ed;color:#12475c;font-weight:700}.empty{padding:16px;color:var(--muted);text-align:center}.foot{margin-top:18px;color:var(--muted);font-size:12px}.bar{height:9px;border-radius:8px;background:#e5eaee;overflow:hidden;margin:5px 0 13px}.bar span{height:100%;background:#16809a;display:block;border-radius:8px}dialog{border:1px solid var(--line);border-radius:12px;max-width:min(460px,92vw);padding:22px;color:var(--ink)}dialog::backdrop{background:#112c3b88}dialog h2{margin-top:0}dialog .buttons{justify-content:flex-end}.sub{margin-top:16px}.notice{color:var(--muted);font-size:13px;margin:8px 0}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{display:none;padding:12px 18px}.sidebar.open{display:block}.mobile-toggle{display:inline-flex}.topbar,.main{padding-left:16px;padding-right:16px}.banner{margin-left:16px;margin-right:16px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.grid,.form-grid{grid-template-columns:1fr}.page-head h1{font-size:25px}.metric strong{font-size:25px}.metric,.panel{padding:13px}.toolbar>label{flex-basis:100%}.profile{width:100%}.profile select{max-width:none;flex:1}.topbar{gap:8px}.metrics{gap:8px}.main{padding-top:16px}.banner{margin-top:12px}}

<body>
<a class="skip" href="#main">Saltar al contenido</a>
<div class="layout">
<aside class="sidebar" id="sidebar"><div class="logo"><div class="logo-mark">QP</div><div><strong>QualityPrint</strong><small>Sistema de gestión de calidad</small></div></div><div class="nav-label">Módulos</div><nav aria-label="Navegación principal" id="nav" class="nav"></nav></aside>
<div class="content"><header class="topbar"><div class="buttons"><button class="btn mobile-toggle" id="toggle" aria-expanded="false" aria-controls="sidebar">Menú</button><strong>QualityPrint · SGC</strong></div><div class="profile"><label for="role">Simular rol</label><select id="role"><option value="CALIDAD">Control de calidad</option><option value="GERENCIA">Gerencia</option><option value="COMERCIAL">Comercial y diseño</option><option value="PRODUCCION">Operación DTF</option><option value="LOGISTICA">Logística</option><option value="ADMIN">Administrador</option></select><button class="btn" data-action="Pantalla de acceso">Acceso</button></div></header>
<div class="banner"><strong>Prototipo de diseño · v0.1.</strong> Datos ficticios. Navegación y filtros de muestra; no guarda, autentica ni autoriza operaciones reales.</div>
<main class="main" id="main" tabindex="-1"></main></div></div>
<dialog id="dialog" aria-labelledby="dialog-title"><h2 id="dialog-title"></h2><p id="dialog-copy"></p><div class="buttons"><button class="btn primary" id="close-dialog">Cerrar vista previa</button></div></dialog>
<script>
"use strict";
const labels={dashboard:"Panel principal",clientes:"Clientes",catalogo:"Catálogo",pedidos:"Pedidos",produccion:"Producción DTF",materiales:"Materiales",inspecciones:"Inspecciones",nc:"No conformidades",ac:"Acciones correctivas",despachos:"Despachos",mantenimiento:"Mantenimiento",usuarios:"Usuarios y roles",soporte:"Seguridad y respaldo"};
const access={ADMIN:["dashboard","usuarios","soporte"],GERENCIA:["dashboard","clientes","catalogo","pedidos","materiales","produccion","inspecciones","nc","ac","despachos","mantenimiento","usuarios","soporte"],CALIDAD:["dashboard","clientes","catalogo","pedidos","materiales","produccion","inspecciones","nc","ac","despachos","mantenimiento"],PRODUCCION:["dashboard","pedidos","materiales","produccion","inspecciones","nc","ac","mantenimiento"],COMERCIAL:["dashboard","clientes","catalogo","pedidos","produccion","inspecciones","nc","ac","despachos"],LOGISTICA:["dashboard","pedidos","materiales","produccion","inspecciones","nc","ac","despachos"]};
const roleNames={ADMIN:"Administrador",GERENCIA:"Gerencia",CALIDAD:"Calidad",PRODUCCION:"Producción",COMERCIAL:"Comercial",LOGISTICA:"Logística"};
let role="CALIDAD",page="dashboard";
const main=document.getElementById("main"),nav=document.getElementById("nav"),dialog=document.getElementById("dialog");
function badge(label,kind=""){return '<span class="pill '+kind+'">'+label+'</span>'}
function action(label,cls=""){return '<button type="button" class="btn '+cls+'" data-action="'+label+'">'+label+'</button>'}
function goto(label,target,cls=""){return '<button type="button" class="btn '+cls+'" data-goto="'+target+'">'+label+'</button>'}
function head(title,desc,buttons=""){return '<div class="crumb">QualityPrint / '+title+'</div><div class="page-head"><div><h1>'+title+'</h1><p>'+desc+'</p></div><div class="buttons">'+buttons+'</div></div>'}
function panel(title,content){return '<section class="panel"><h2>'+title+'</h2>'+content+'</section>'}
function grid(...panels){return '<div class="grid">'+panels.join("")+'</div>'}
function metric(label,value,note){return '<div class="metric"><span>'+label+'</span><strong>'+value+'</strong><small>'+note+'</small></div>'}
function table(headers,rows){return '<div class="table-wrap"><table><thead><tr>'+headers.map(x=>'<th scope="col">'+x+'</th>').join("")+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join("")+'</tr>').join("")+'</tbody></table></div>'}
function filtered(headers,rows,states=[]){return '<div class="toolbar"><label class="field">Buscar registro<input id="find" type="search" placeholder="Código o texto"></label><label class="field">Estado<select id="status"><option value="">Todos</option>'+states.map(x=>'<option>'+x+'</option>').join("")+'</select></label><button class="btn" data-clear="1">Limpiar</button></div><div id="filtered-table">'+table(headers,rows)+'</div><p id="row-count" class="notice" role="status">'+rows.length+' registros de ejemplo · Página 1 de 1</p>'}
function field(label,value){return '<label class="field">'+label+'<input readonly value="'+value+'"></label>'}
function fields(arr){return '<div class="form-grid">'+arr.map(x=>field(x[0],x[1])).join("")+'</div>'}
function checklist(arr){return '<ul class="check-list">'+arr.map(x=>'<li><span>'+x[0]+'</span>'+x[1]+'</li>').join("")+'</ul>'}
function can(...roles){return roles.includes(role)}
function dashboard(){
 let items=role==="ADMIN"?[["Cuentas activas","5","Cuentas de muestra"],["Alertas","1","Eventos técnicos"]]:role==="CALIDAD"||role==="GERENCIA"?[["Pedidos en curso","12","Al corte de ejemplo"],["Lotes en proceso","4","Producción"],["Prendas retenidas","3","Sin liberación"],["NC abiertas","2","Requieren seguimiento"]]:role==="PRODUCCION"?[["Lotes asignados","4","Operación"],["Primera pieza pendiente","1","Esperar decisión"],["Controles por registrar","3","Lote de muestra"]]:role==="COMERCIAL"?[["Pedidos en curso","5","Asignados"],["Diseños pendientes","2","Aceptación cliente"],["Entregas por confirmar","1","Seguimiento"]]:[["Insumos por revisar","2","Recepción"],["Unidades liberadas","8","Disponibles"],["Despachos pendientes","1","Seguimiento"]];
 let indicator=can("CALIDAD","GERENCIA")?panel("Indicadores del mes · noviembre 2026",table(["Indicador","Resultado","Meta","Estado"],[["Defectos (4/100)","4 %","≤ 5 %",badge("Cumple","ok")],["Entregas puntuales (19/20)","95 %","≥ 95 %",badge("Cumple","ok")],["Cobertura (20/20)","100 %","100 %",badge("Cumple","ok")],["Registro NC (4/5)","80 %","100 %",badge("No cumple","bad")],["Mantenimiento (0/0)","N/D","100 %",badge("Sin datos")]])):"";
 let links=access[role].filter(x=>x!=="dashboard").slice(0,5).map(x=>goto(labels[x],x)).join("");
 return head("Panel principal","Resumen de operaciones · "+roleNames[role],action("Período de ejemplo"))+'<div class="metrics">'+items.map(x=>metric(...x)).join("")+'</div>'+grid(indicator||panel("Resumen de tu función",'<p class="muted">Los datos del panel deberán corresponder al alcance autorizado. Ejemplo visual.</p>'),panel("Accesos rápidos",'<div class="buttons">'+links+'</div><p class="notice">Acciones disponibles según el rol simulado.</p>'));
}
function pedidos(){return head("Pedidos","Registro, requisitos, aprobación y seguimiento",can("COMERCIAL")?goto("Nuevo pedido","pedido_nuevo","primary"):"")+panel("Listado de pedidos",filtered(["Código","Cliente / referencia","Entrega","Estado comercial","Avance","Acción"],[["PED-026","Cliente ficticio A","22 nov 2026",badge("Confirmado","ok"),"Inspección",goto("Ver pedido","pedido_detalle")],["PED-027","Cliente ficticio B","24 nov 2026",badge("Pendiente","warn"),"Arte sin aprobar","Solo listado"],["PED-028","Cliente ficticio C","25 nov 2026",badge("Confirmado","ok"),"Producción","Solo listado"]],["Confirmado","Pendiente","Cancelado","Rechazado"]))}
function pedidoNuevo(){return head("Nuevo pedido","Maqueta de formulario · no almacena información",goto("Volver","pedidos"))+'<form id="demo-form"><div class="grid">'+panel("1. Datos del pedido",'<div class="form-grid"><label class="field">Cliente *<select required><option value="">Seleccionar</option><option>Cliente ficticio A</option><option>Cliente ficticio B</option></select></label><label class="field">Fecha acordada *<input type="date" required value="2026-11-25"></label><label class="field">Modalidad *<select required><option>Recolección</option><option>Envío</option></select></label><label class="field">Notas de ejemplo<textarea rows="2" placeholder="Especificaciones ficticias"></textarea></label></div>')+panel("2. Línea de prenda",'<div class="form-grid"><label class="field">Variante *<select required><option value="">Seleccionar</option><option>Camiseta blanca · M · algodón</option><option>Camiseta negra · L · algodón</option></select></label><label class="field">Cantidad *<input id="demo-qty" type="number" min="1" step="1" required value="10"></label><label class="field">Arte de referencia *<input required value="ARTE-01" maxlength="80"></label><label class="field">Ancho (cm) *<input type="number" required min="0.1" step="0.1" value="22"></label></div><p class="notice">Total de ejemplo: <strong id="demo-total">10</strong> prendas. El diseño completo se registra y aprueba en una pantalla posterior.</p>')+'</div><div class="buttons sub"><button type="submit" class="btn primary">Revisar formulario de ejemplo</button>'+goto("Cancelar vista","pedidos")+'</div></form>'}
function pedidoDetalle(){return head("Pedido PED-026","Versión vigente 2 · ejemplo de detalle",goto("Volver","pedidos")+(can("COMERCIAL")?action("Solicitar modificación"):""))+'<div class="steps"><span>1. Requisitos</span><span>2. Diseño y aceptación</span><span class="active">3. Producción</span><span>4. Calidad</span><span>5. Entrega</span></div>'+grid(panel("Identificación",fields([["Código","PED-026"],["Referencia cliente","Cliente ficticio A"],["Entrega acordada","22/11/2026"],["Estado comercial","Confirmado"]])),panel("Controles de transferencia",checklist([["Requisitos completos",badge("Cumple","ok")],["Factibilidad viable",badge("Cumple","ok")],["Diseños aprobados",badge("Cumple","ok")],["Disponibilidad confirmada",badge("Cumple","ok")]])+(can("COMERCIAL")?'<div class="buttons sub">'+action("Autorizar transferencia","primary")+'</div>':"")))+'<div class="sub">'+panel("Líneas y diseños",table(["Línea","Producto / talla","Cantidad","Diseño","Versión"],[["1","Camiseta / M","10","Arte 01","v2 aprobada"]]))+'</div>'}
function produccion(){return head("Producción DTF","Lotes, configuración y controles",can("PRODUCCION")?action("Crear lote","primary"):"")+grid(panel("Lotes de producción",table(["Lote","Pedido","Asignadas","Estado","Acción"],[["LOT-042","PED-026","10",badge("Cerrado","ok"),action("Consultar lote")],["LOT-043","PED-028","12",badge("Detenido","bad"),action("Consultar lote")]])),panel("Primera pieza · LOT-043",fields([["Configuración","Revisión 1"],["Unidad","UNI-043-01"],["Resultado","Pendiente"],["Operador","Operador de prueba"]])+'<div class="callout">No continuar con las unidades restantes hasta que Calidad acepte la primera pieza.</div><div class="buttons sub">'+(can("CALIDAD")?action("Evaluar primera pieza","primary"):can("PRODUCCION")?action("Registrar primera pieza","primary"):"")+'</div>'))+'<div class="sub">'+panel("Conciliación · LOT-042",fields([["Procesadas","10"],["Aptas para inspección","10"],["Retenidas","0"],["Descartadas","0"]]))+'</div>'}
function inspecciones(){return head("Inspecciones","Evaluación individual, defectos y liberación",can("CALIDAD")?action("Nueva inspección","primary"):"")+grid(panel("Inspección INS-018 · LOT-042",fields([["Pedido","PED-026"],["Unidad seleccionada","UNI-042-09"],["Revisión","1"],["Situación","Retenida"]])+table(["Criterio","Resultado","Referencia"],[["DEF-03 Dimensiones",badge("NC","bad"),"Fuera de tolerancia"],["DEF-06 Manchas",badge("NC","bad"),"Hallazgo visual"],["DEF-07 Adhesión",badge("C","ok"),"Comprobada"]])+ (can("CALIDAD")?'<div class="buttons sub">'+action("Registrar resultado")+action("Registrar reinspección")+'</div>':"")),panel("Conciliación de lote",checklist([["Presentadas / inspeccionadas","10 / 10"],["Conformes","8"],["Retenidas",badge("2","warn")],["Rechazadas","0"],["Autorizadas para entrega","0"]])+'<div class="callout">Liberación bloqueada: no se cumplen las 10 unidades acordadas. Compruebe tratamiento o autorización expresa de entrega parcial.</div>'+(can("CALIDAD")?'<div class="buttons sub"><button class="btn primary" disabled>Autorizar liberación</button>'+goto("Ver no conformidades","nc")+'</div>':"")))}
function nc(){return head("No conformidades","Detección, alcance, tratamiento y cierre",can("GERENCIA","CALIDAD","COMERCIAL","PRODUCCION","LOGISTICA")?action("Reportar evento","primary"):"")+panel("Registros de seguimiento",filtered(["Código","Origen","Prioridad","Estado","Acción"],[["NC-007","INS-018 · UNI-042-09",badge("Mayor","warn"),badge("En tratamiento","warn"),goto("Ver detalle","nc_detalle")],["NC-008","Control de producción",badge("Menor"),badge("Abierta","warn"),"Solo listado"],["NC-009","Inspección de materiales",badge("Crítica","bad"),badge("Pendiente de verificación","warn"),"Solo listado"]],["Abierta","En tratamiento","Pendiente de verificación","Cerrada"]))}
function ncDetalle(){return head("No conformidad NC-007","Evento independiente EVT-014 · prioridad mayor",goto("Volver","nc"))+'<div class="steps"><span>Detección</span><span class="active">Tratamiento</span><span>Verificación</span><span>Cierre</span></div>'+grid(panel("Alcance y contención",fields([["Unidad","UNI-042-09"],["Requisito","DEF-03 / DEF-06"],["Cantidad","1 prenda"],["Estado","En tratamiento"]])+'<p>Unidad identificada y apartada del despacho.</p>'),panel("Tratamiento autorizado",checklist([["Disposición","Retrabajo"],["Responsable","Producción"],["Verificación",badge("Pendiente","warn")],["AC requerida",badge("Evaluar")]])+(can("CALIDAD")?'<div class="buttons sub">'+action("Autorizar disposición","primary")+'<button class="btn" disabled>Cerrar NC</button></div>':"")+'<div class="callout">No se permite cerrar mientras falte verificación o decisión sobre AC.</div>'))}
function ac(){return head("Acciones correctivas","Causa, plan y verificación de eficacia",can("CALIDAD")?action("Crear acción correctiva","primary"):"")+grid(panel("AC-003 · Defecto repetitivo",fields([["NC vinculadas","NC-006, NC-007"],["Estado","Pendiente de eficacia"],["Responsable","Producción"],["Criterio","3 lotes sin recurrencia"]])+ '<p class="notice">Avance de evaluación: 2 de 3 lotes</p><div class="bar" role="progressbar" aria-label="Lotes evaluados" aria-valuenow="2" aria-valuemax="3"><span style="width:66.67%"></span></div>'),panel("Control del plan",checklist([["Causa confirmada",badge("Sí","ok")],["Plan aprobado",badge("Sí","ok")],["Ejecución evidenciada",badge("Sí","ok")],["Evaluación completa",badge("Pendiente","warn")]])+(can("CALIDAD")?'<div class="buttons sub">'+action("Evaluar eficacia","primary")+'<button class="btn" disabled>Cerrar AC</button></div>':can("GERENCIA")?action("Revisar recursos"):"")+'<div class="callout">Dos lotes evaluados no satisfacen el mínimo de tres.</div>'))}
const simple={
 clientes:{desc:"Identificación y contacto de clientes",heads:["Código","Nombre","Estado"],rows:[["CLI-001","Cliente ficticio A",badge("Activo","ok")],["CLI-002","Cliente ficticio B",badge("Activo","ok")]],write:["COMERCIAL"],label:"Nuevo cliente"},
 catalogo:{desc:"Productos y variantes",heads:["Código","Producto","Tejido / talla","Estado"],rows:[["VAR-001","Camiseta blanca","Algodón / M",badge("Activo","ok")],["VAR-002","Camiseta negra","Algodón / L",badge("Activo","ok")]],write:["COMERCIAL"],label:"Nueva variante"},
 materiales:{desc:"Recepción e inspección de insumos",heads:["Partida","Material","Cantidad","Estado"],rows:[["REC-031","Film DTF","20 m",badge("Liberado","ok")],["REC-032","Adhesivo","2 kg",badge("Retenido","bad")]],write:["LOGISTICA","PRODUCCION","CALIDAD"],label:"Registrar operación de material"},
 despachos:{desc:"Unidades liberadas y recepción por unidad",heads:["Pedido","Unidades","Entrega","Estado"],rows:[["PED-025","8","18/11/2026",badge("Entregado","ok")],["PED-026","0","Pendiente",badge("Bloqueado","bad")]],write:["LOGISTICA"],label:"Registrar despacho"},
 mantenimiento:{desc:"Plan preventivo y evidencia de ejecución",heads:["Equipo","Actividad","Fecha original","Estado"],rows:[["IMP-01","Control preventivo según manual","25/11/2026",badge("Pendiente","warn")]],write:["GERENCIA","PRODUCCION"],label:"Registrar actividad de mantenimiento"},
 usuarios:{desc:"Cuentas individuales y roles autorizados",heads:["Cuenta","Rol","Estado"],rows:[["usr-calidad","CALIDAD",badge("Activo","ok")],["usr-operador","PRODUCCION",badge("Activo","ok")]],write:["ADMIN"],label:"Crear cuenta"},
 soporte:{desc:"Eventos técnicos y estado de respaldos",heads:["Registro","Fecha","Resultado"],rows:[["RES-001","19/11/2026",badge("Verificado","ok")]],write:["ADMIN"],label:"Consultar operación de respaldo"}
};
function generic(key){let a=simple[key];const states=[...new Set(a.rows.flat().flatMap(x=>Array.from(x.matchAll(/class="pill[^"]*">([^<]+)/g),m=>m[1])))];return head(labels[key],a.desc,can(...a.write)?action(a.label,"primary"):"")+panel(labels[key],filtered(a.heads,a.rows,states));}
const screens={dashboard,pedidos,pedido_detalle:pedidoDetalle,pedido_nuevo:pedidoNuevo,produccion,inspecciones,nc,nc_detalle:ncDetalle,ac};
function parentKey(key){return key==="pedido_detalle"||key==="pedido_nuevo"?"pedidos":key==="nc_detalle"?"nc":key}
function render(focus=false){if(!access[role].includes(parentKey(page))||(page==="pedido_nuevo"&&role!=="COMERCIAL"))page="dashboard";nav.innerHTML=access[role].map(k=>'<button type="button" data-goto="'+k+'"'+(parentKey(page)===k?' aria-current="page"':'')+'>'+labels[k]+'</button>').join("");main.innerHTML=(screens[page]?screens[page]():generic(page))+'<p class="foot">QualityPrint · Prototipo académico de interfaz, noviembre 2026. No representa registros de una empresa real.</p>';if(focus){main.focus();document.getElementById("sidebar").classList.remove("open");document.getElementById("toggle").setAttribute("aria-expanded","false");}}
function filter(){const t=document.getElementById("filtered-table");if(!t)return;const query=document.getElementById("find").value.trim().toLowerCase(),state=document.getElementById("status").value.toLowerCase();let count=0;t.querySelectorAll("tbody tr").forEach(tr=>{const txt=tr.textContent.toLowerCase();tr.hidden=!(txt.includes(query)&&(!state||Array.from(tr.querySelectorAll(".pill")).some(p=>p.textContent.toLowerCase()===state)));if(!tr.hidden)count++;});document.getElementById("row-count").textContent=count+" registros visibles de ejemplo";}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b||b.disabled)return;if(b.dataset.goto){if(access[role].includes(parentKey(b.dataset.goto))){page=b.dataset.goto;render(true);}}else if(b.dataset.action){document.getElementById("dialog-title").textContent=b.dataset.action;document.getElementById("dialog-copy").textContent="Esta acción representa una futura pantalla o confirmación. Es una maqueta: no valida credenciales ni guarda, cambia o autoriza datos. Las reglas se implementarán en Flask.";dialog.showModal();}else if(b.dataset.clear){document.getElementById("find").value="";document.getElementById("status").value="";filter();}});
document.addEventListener("submit",e=>{if(e.target.id==="demo-form"){e.preventDefault();document.getElementById("dialog-title").textContent="Revisión de maqueta";document.getElementById("dialog-copy").textContent="Campos de muestra completos. No se ha guardado ningún pedido. La validación de negocio se implementará en Flask.";dialog.showModal();}});
document.getElementById("role").addEventListener("change",e=>{role=e.target.value;page="dashboard";render(true);});document.addEventListener("input",e=>{if(e.target.id==="find")filter();if(e.target.id==="demo-qty")document.getElementById("demo-total").textContent=e.target.validity.valid?e.target.value:"—";});document.addEventListener("change",e=>{if(e.target.id==="status")filter();});document.getElementById("close-dialog").addEventListener("click",()=>dialog.close());
document.getElementById("toggle").addEventListener("click",()=>{const v=document.getElementById("sidebar").classList.toggle("open");document.getElementById("toggle").setAttribute("aria-expanded",String(v));});render();
</script>
